name: commitlint

# Called by every repository's CI:
#   uses: greylocklabs/.github/.github/workflows/commitlint.yml@v1
on:
  workflow_call:
    inputs:
      config:
        description: The commitlint config file, relative to the repository root
        type: string
        default: commitlint.config.mjs

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ${{ inputs.config }}
