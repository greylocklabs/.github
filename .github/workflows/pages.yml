name: pages

# Publishes a folder to GitHub Pages. The caller grants pages: write and id-token: write:
#   uses: greylocklabs/.github/.github/workflows/pages.yml@v1
on:
  workflow_call:
    inputs:
      path:
        description: The folder to publish
        type: string
        default: www

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.path }}
          # Publishes .well-known/, which Microsoft and others read to verify a domain.
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
